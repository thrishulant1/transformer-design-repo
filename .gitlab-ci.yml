# 1) check:  index.html must match the sources in src/ (run  python tools/build.py  before committing)
# 2) test:   re-run the reference designs (70 kVA CAL1, 500 kVA method, 600 kVA sheet)
# 3) pages:  publish index.html, only on the default branch and only if 1 and 2 passed
stages: [check, test, deploy]
build-check:
  stage: check
  image: node:20
  script:
    - python3 tools/build.py --check
regression:
  stage: test
  image: node:20
  script:
    - node tests/regression.js
pages:
  stage: deploy
  needs: [build-check, regression]
  script:
    - mkdir -p public
    - cp index.html public/
  artifacts:
    paths: [public]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
